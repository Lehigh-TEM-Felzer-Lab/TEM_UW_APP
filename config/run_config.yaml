# TEM_UW_APP run configuration. Copy to the case directory as run_config.yaml and edit; keys you do not
# set take the values below, unknown keys are rejected. Relative paths are relative to the case
# directory; environment variables are expanded.
#
# The app builds the NetCDF inputs and tem_config.yaml of TEM_2026 from your data, then runs the model.

# Job
case_name: null # SLURM job name; null uses the name of the case directory
run_mode: local # local: run in the foreground | slurm: submit with sbatch
run_model: true # false: only build the case
mpi_tasks: 1 # processes; more than 1 needs TEM_2026 built with -DUSE_MPI=ON
modules: [] # modules loaded before the run (slurm)
walltime: 1 # hours
partition: null
account: null
mem: 8 # GB
sbatch_options: "" # extra sbatch flags, for example "--mail-type=END"

# TEM_2026 checkout: provides templates/tem_config.yaml and params/, and build/xtem
tem2026_dir: null # REQUIRED
tem_exe: null # null: <tem2026_dir>/build/xtem
tem: # any tem_config.yaml key to set, for example {veg_fire: 1, fire_mode: 1, fire_topography: 1, xnfertflag: 1, xtws10flag: 1}

# Grid and time (the core does no regridding; this app does it)
horizontal_resolution: 0.5 # degrees
lon_min: null # REQUIRED
lon_max: null
lat_min: null
lat_max: null
region: TEM
regrid_method: box_mean # box_mean (area average, when the source is finer) | bilinear | nearest
start_year: null # REQUIRED
end_year: null # REQUIRED

# Climate: one path, a glob or a list; merged by coordinates. Units come from the "units" attribute.
#   tair   or tmin + tmax        dtr   or tmin + tmax      prec    nirr
#   vpr    or dewpoint or huss (+ ps)
#   wind   or u10 + v10          elev  (optional here; may be in static_file)
netcdf_input_file: null # REQUIRED
netcdf_input_frequency: monthly # hourly | daily | monthly
netcdf_varmap: # TEM input: variable in the file
surface_pressure_hpa: 1013.25 # for vpr from huss when ps is not in netcdf_varmap

# Other inputs, NetCDF with the variable names of TEM_2026 docs/data.md (rename with tem_varmap).
# Categorical variables (lulc, mxcohort, ...) are regridded with nearest, the rest with regrid_method.
static_file: null # elev, sand, silt, clay, ndep, mxcohort (lat,lon); wind, ozone (month,lat,lon)
lulc_file: null # land cover, (cohort,lat,lon)
co2_file: null # co2 (time), annual
fire: # used when tem: {veg_fire: 1}
  flashes_file: null # lightning flashes km-2 month-1 (12 months, lat, lon)
  popdens_file: null # population density km-2 (lat, lon)
tem_varmap: # model input key (varmap block of tem_config.yaml) : variable name in your file
