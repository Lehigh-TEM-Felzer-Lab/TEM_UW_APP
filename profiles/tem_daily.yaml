name: tem_daily
description: TEM-Hydro, daily time step
repository: Lehigh-TEM-Felzer-Lab/TEM_Daily
xml_template: tem_daily.xml          # WLR_daily_new_cal.xml of the repository without its stray closing tag
time_step: daily                     # daily rows: lon,lat, VAR ,area,year,month,day,value, region; 365 or 366 rows per year
exact_coordinates: false
wind_transient: true                 # daily wind series (xtws10flag 1); needs a wind variable with time
params: true
climate_inputs: [tair, dtr, prec, nirr, vpr]
climate_tags:
  tair: [itairfname, itairend]
  dtr: [itrangefname, itrangeend]
  prec: [iprecfname, iprecend]
  nirr: [inirrfname, inirrend]
  vpr: [ivprfname, ivprend]
  wind: [iws10fname, iws10end]
  elev: [felev, null]
  co2: [ico2fname, ico2end]
  ozone: [io3fname, io3end]
static_tags:            # static input -> [XML tag of the file name, XML tag of the extension or null]
  texture: [fstexture, null]
  co2: [ico2fname, ico2end]
  ozone: [io3fname, io3end]
  ndep: [ndepfname, ndepend]
  max_cohorts: [imxcohrtfname, imxcohrtend]
  cohorts: [ilulcfname, ilulcend]
co2_daily: true                       # TEM_Daily reads CO2 as daily rows per cell (climate/co2.csv)
ozone_daily: true                     # long-term monthly AOT40 expanded to one non-leap year of daily rows
fire_tag: null
param_tags: [cmntecd, rootzecd, vegecd, conductecd, mcrbecd, agecd, datfilenames]
output_tags: {variables: temoutvars, files: temoutfiles, count: ntemout, climate_files: clmoutfiles}
output_pattern: "{var}_dly.WLR"
fixed_tags:
  xtws10flag: 1
  intervalflag: 0                    # daily output files
