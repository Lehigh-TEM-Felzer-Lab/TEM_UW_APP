name: tem_biogeography
description: TEM-Hydro with the biogeography module and fire (monthly)
repository: Lehigh-TEM-Felzer-Lab/TEM_Biogeography
xml_template: tem_biogeography.xml   # tem_core/ of the repository, default tag values and comments
time_step: monthly                   # step of the climate files: monthly rows, one row per cell and year
exact_coordinates: true              # the fire module matches coordinates exactly (multiples of 0.25 degrees)
params: true                         # needs params_dir
climate_inputs: [tair, dtr, prec, nirr, vpr]
climate_tags:           # TEM input -> [XML tag of the file name, XML tag of the extension or null]
  tair: [itairfname, itairend]
  dtr: [itrangefname, itrangeend]
  prec: [iprecfname, iprecend]
  nirr: [inirrfname, inirrend]
  vpr: [ivprfname, ivprend]
  wind: [iws10fname, null]
  elev: [felev, null]
static_tags:            # static input -> [XML tag of the file name, XML tag of the extension or null]
  texture: [fstexture, null]
  co2: [ico2fname, null]
  ozone: [io3fname, io3end]
  ndep: [ndepfname, ndepend]
  max_cohorts: [imxcohrtfname, imxcohrtend]
  cohorts: [ilulcfname, ilulcend]
fire_tag: ifirefname                 # fire_file is translated to this CSV; missing file disables fires
param_tags: [cmntecd, rootzecd, vegecd, conductecd, mcrbecd, agecd, datfilenames]
output_tags: {variables: temoutvars, files: temoutfiles, count: ntemout, climate_files: clmoutfiles}
output_pattern: "{var}.TEMOUT"
fixed_tags:
  mmdioutfile: ./HIST/MMDI.csv
  fireoutfile: ./HIST/FIRE.csv
