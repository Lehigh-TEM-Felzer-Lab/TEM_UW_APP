# Western USA example: 2015-2024 monthly CCSM4 RCP8.5 climate on a 0.5 degree grid.
# Copy to an empty work directory, point params_dir at the parameter files of the core, run case_submit.sh.
core: tem_biogeography       # profile name in profiles/, or a path to your own profile
params_dir: /path/to/params  # directory holding the .ecd/.dat files named by the core template
static_dir: $TUP_ROOT/examples/west/static
netcdf_input_file: $TUP_ROOT/examples/west/climate_ccsm4_rcp85.nc
netcdf_input_frequency: monthly
netcdf_varmap: {tair: tair, dtr: dtr, prec: prec, nirr: nirr, vpr: vpr, wind: wind, elev: elev}
resolution: 0.5
lon_min: -124.5
lon_max: -123.5
lat_min: 40.0
lat_max: 43.0
region: WESTERN_USA
start_year: 2015
end_year: 2024
